<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>marc</title>
  <style>
    body {
      font-family: instrument-serif;
      background-color: #fdfdfd;
      color: #111;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    main {
      flex-grow: 1;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #ddd;
      padding-top: 1rem;
    }

    .menu a {
      margin-right: 1rem;
      text-decoration: none;
      color: #444;
    }

    .menu a:hover {
      color: #000;
    }

    .last-updated {
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>posts//</h1>
    <p>sporadic updates.</p>
  </header>

  <main>
    <h2>directive</h2>
    <p>our purpose is to move the world by exchange of work, objects, information, and ideas, 
        between people assembling as firms, in small and great numbers. Keep it clean and focused.</p>

    <img src="your-image.jpg" alt="Description of image" style="max-width: 100%; height: auto;" />
  </main>

  <footer>
    <div class="menu">
      <a href="https://www.linkedin.com/in/mbienaime" target="_blank">LinkedIn</a>
      <a href="https://twitter.com/marcbienaime" target="_blank">X</a>
      <a href="https://open.spotify.com/user/1233284565?si=689fe8c6172f4067" target="_blank">Spotify</a>
      <a href="/archive">Archive</a>
    </div>
    <div class="last-updated">Last updated: <span id="last-updated"></span></div>
    <script>
      document.getElementById('last-updated').textContent = new Date(document.lastModified).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: '2-digit'
      });
    </script>
  </footer>
</body>
</html>
